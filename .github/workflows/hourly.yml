name: Hourly signal run

on:
  schedule:
    - cron: "7 * * * *"      # every hour at :07 (UTC)
  workflow_dispatch:          # lets you press "Run workflow" by hand

permissions:
  contents: write

concurrency:
  group: signal-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run one hourly cycle (paper trading)
        run: python run.py
      - name: Save results
        run: |
          git config user.name "signal-bot"
          git config user.email "signal-bot@users.noreply.github.com"
          git add data/state.json docs/report.json
          git diff --cached --quiet || git commit -m "Hourly run $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push
